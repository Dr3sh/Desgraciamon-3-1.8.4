<style>
  :root {
    --bg: #0b0f19;
    --panel: #121826;
    --card: #171f31;
    --border: #26324b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(18, 24, 38, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { margin: 0; font-size: 16px; color: #f8fafc; }
  .brand span { font-size: 12px; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .btn {
    background: #1e293b;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s ease;
  }
  button:hover, .btn:hover { border-color: var(--accent); background: #243249; }
  button.primary { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 600; }
  button.primary:hover { background: #0369a1; }
  button.success { background: #065f46; border-color: #34d399; color: #ecfdf5; font-weight: 600; }
  button.success:hover { background: #047857; }
  input[type="text"], input[type="search"] {
    background: #0d1320;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    outline: none;
  }
  input[type="search"]:focus, input[type="text"]:focus, textarea:focus { border-color: var(--accent); }

  .prism-builder {
    max-width: 1280px;
    margin: 14px auto 0;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .prism-builder label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type="color"] {
    width: 30px; height: 26px; padding: 0; border: 1px solid var(--border);
    border-radius: 4px; background: transparent; cursor: pointer;
  }
  .drop-zone {
    max-width: 1280px;
    margin: 12px auto 0;
    padding: 14px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .drop-zone.dragover { border-color: var(--accent); background: rgba(56, 189, 248, 0.08); color: #fff; }

  main {
    max-width: 1280px;
    margin: 14px auto 60px;
    padding: 0 14px;
    display: grid;
    gap: 12px;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: grid;
    gap: 8px;
  }
  .entry-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .entry-key {
    font-family: Consolas, monospace;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
  }
  .entry-context {
    font-size: 11.5px;
    color: #cbd5e1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 5px;
    padding: 3px 8px;
    display: inline-block;
  }
  .entry-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .entry-actions button { padding: 4px 8px; font-size: 12px; }
  .preview {
    background: #080b12;
    border: 1px solid #1e293b;
    border-radius: 6px;
    padding: 9px 12px;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 36px;
  }
  .is-bold {
    font-weight: 900;
    letter-spacing: 0.4px;
  }
  textarea {
    width: 100%;
    min-height: 52px;
    resize: vertical;
    background: #0d1320;
    color: #e2e8f0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .placeholder-pill {
    display: inline-block;
    background: rgba(56, 189, 248, 0.16);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #7dd3fc;
    border-radius: 4px;
    padding: 0 4px;
    font-size: 12px;
    margin: 0 1px;
  }
  .prism-span {
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 250% 100%;
    animation: prismShift 3.5s linear infinite;
  }
  @keyframes prismShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 250% 50%; }
  }
  .status { font-size: 12px; color: var(--green); }
</style>
</head>

<script>
const LEGACY = {
  '0':'#000000','1':'#0000AA','2':'#00AA00','3':'#00AAAA','4':'#AA0000','5':'#AA00AA','6':'#FFAA00','7':'#AAAAAA',
  '8':'#555555','9':'#5555FF','a':'#55FF55','b':'#55FFFF','c':'#FF5555','d':'#FF55FF','e':'#FFFF55','f':'#FFFFFF'
};

let fileHandle = null;
let originalData = {};
let data = {};
let activeTextarea = null;

const elList = document.getElementById('list');
const elSearch = document.getElementById('search');
const elFileInfo = document.getElementById('fileInfo');
const elStatus = document.getElementById('statusMsg');

function setStatus(msg) {
  elStatus.textContent = msg;
  setTimeout(() => { if (elStatus.textContent === msg) elStatus.textContent = ''; }, 3000);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function expandHex(hex) {
  const h = hex.replace('#','');
  return '#' + (h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h);
}

function renderRichPreview(template) {
  const tokenRe = /<color=#(?:[0-9a-f]{6}|[0-9a-f]{3})>|<bold>|<italic>|<prism=[^<>]{1,200}>|<\/(?:color|bold|italic|prism)>|\{[A-Za-z][A-Za-z0-9_]*\}|§[0-9a-flmnor]/gi;
  let stack = [];
  let state = { color: '#e2e8f0', bold: false, italic: false, prism: null };
  let out = '';
  let last = 0;

  function emitText(txt) {
    if (!txt) return;
    const styleParts = [];
    const classes = [];
    if (state.bold) {
      classes.push('is-bold');
      if (!state.prism) styleParts.push('text-shadow:0.6px 0 0 currentColor');
    }
    if (state.italic) styleParts.push('font-style:italic');
    if (state.prism) {
      classes.push('prism-span');
      const cols = [...state.prism.colors, state.prism.colors[0]].join(', ');
      const dur = state.prism.speed === 0 ? 0 : Math.max(0.6, 3.5 / Math.abs(state.prism.speed));
      styleParts.push(`background-image:linear-gradient(90deg, ${cols})`);
      if (dur > 0) styleParts.push(`animation-duration:${dur.toFixed(2)}s`);
      else styleParts.push('animation:none');
      out += `<span class="${classes.join(' ')}" style="${styleParts.join(';')}">${escapeHtml(txt)}</span>`;
    } else {
      styleParts.push(`color:${state.color}`);
      const clsAttr = classes.length ? ` class="${classes.join(' ')}"` : '';
      out += `<span${clsAttr} style="${styleParts.join(';')}">${escapeHtml(txt)}</span>`;
    }
  }

  for (const m of template.matchAll(tokenRe)) {
    if (m.index > last) emitText(template.slice(last, m.index));
    const tok = m[0];
    const low = tok.toLowerCase();
    if (low.startsWith('<color=')) {
      stack.push({ tag: 'color', prev: { ...state } });
      state.color = expandHex(tok.slice(7, -1));
    } else if (low === '<bold>') {
      stack.push({ tag: 'bold', prev: { ...state } });
      state.bold = true;
    } else if (low === '<italic>') {
      stack.push({ tag: 'italic', prev: { ...state } });
      state.italic = true;
    } else if (low.startsWith('<prism=')) {
      stack.push({ tag: 'prism', prev: { ...state } });
      const inner = tok.slice(7, -1);
      const colors = [...inner.matchAll(/#([0-9a-f]{6}|[0-9a-f]{3})/gi)].map(x => expandHex(x[0]));
      const spdMatch = inner.match(/speed=(-?[0-9]+(?:\.[0-9]+)?)/i);
      const speed = spdMatch ? parseFloat(spdMatch[1]) : 1.0;
      if (colors.length) state.prism = { colors, speed };
    } else if (low.startsWith('</')) {
      const closeTag = low.slice(2, -1);
      for (let i = stack.length - 1; i >= 0; i--) {
        if (stack[i].tag === closeTag) {
          state = stack[i].prev;
          stack.length = i;
          break;
        }
      }
    } else if (tok.startsWith('{')) {
      out += `<span class="placeholder-pill">${escapeHtml(tok)}</span>`;
    } else if (tok.startsWith('§')) {
      const code = tok[1].toLowerCase();
      if (LEGACY[code]) { state.color = LEGACY[code]; state.prism = null; }
      else if (code === 'l') state.bold = true;
      else if (code === 'o') state.italic = true;
      else if (code === 'r') state = { color: '#e2e8f0', bold: false, italic: false, prism: null };
    }
    last = m.index + tok.length;
  }
  if (last < template.length) emitText(template.slice(last));
  return out || '<span style="color:#475569">(vacío)</span>';
}

function getContextForKey(key) {
  if (CONTEXTS[key]) return CONTEXTS[key];
  if (key.startsWith('badge.') && key.endsWith('.icon')) return 'Chat / Tab / GUI · Icono de la insignia';
  if (key.startsWith('badge.') && key.endsWith('.name')) return 'Chat / Hover / GUI · Nombre de la insignia';
  if (key.startsWith('badge.') && key.endsWith('.description')) return 'Hover / GUI · Descripción de la insignia';
  if (key.startsWith('discord.')) return 'Discord Bot · Respuesta o texto de comando slash en Discord';
  if (key.startsWith('team.color.')) return 'Discord Embed · Color hex del embed según si es Shiny o Normal';
  if (key.startsWith('team.')) return 'Discord Embed · Campo del embed de /equipo en Discord';
  if (key.startsWith('invite.') || key.startsWith('kick.')) return 'Chat · Invitación o expulsión dentro del Mundo Espejo';
  if (key.startsWith('memory.')) return 'Chat · Etiqueta de recuerdo (Shiny / Legendario) en Mundo Espejo';
  if (key.startsWith('admin.')) return 'Chat al admin · Respuesta de comando administrativo';
  if (key.startsWith('challenge.')) return 'Chat · Desafíos de combate en Showdown Arena';
  if (key.startsWith('arena.') || key.startsWith('tournament.') || key.startsWith('lights.') || key.startsWith('zone.')) return 'Chat / ActionBar · Mensajes de Showdown Arena';
  if (key.startsWith('market.') || key.startsWith('economy.') || key.startsWith('bank.')) return 'Chat · Avisos o comandos de Economía y Mercado';
  if (key.startsWith('announcement.') || key.startsWith('mission.') || key.startsWith('daily.')) return 'Chat / GUI · Anuncios y Misiones diarias';
  if (key.startsWith('catch.') || key.startsWith('legendary.')) return 'Chat / GUI · Avisos de captura y Bestiario Legendario';
  return 'Texto configurable del mod';
}

function renderList() {
  const q = elSearch.value.trim().toLowerCase();
  elList.innerHTML = '';
  const keys = Object.keys(data).filter(k => !q || k.toLowerCase().includes(q) || String(data[k]).toLowerCase().includes(q));
  for (const key of keys) {
    const card = document.createElement('div');
    card.className = 'entry';

    const head = document.createElement('div');
    head.className = 'entry-head';
    head.innerHTML = `<div><span class="entry-key">${escapeHtml(key)}</span> <span class="entry-context">${escapeHtml(getContextForKey(key))}</span></div>`;

    const actions = document.createElement('div');
    actions.className = 'entry-actions';
    const btnReset = document.createElement('button');
    btnReset.textContent = 'Restaurar';
    btnReset.onclick = () => {
      data[key] = originalData[key];
      ta.value = data[key];
      prev.innerHTML = renderRichPreview(data[key]);
      setStatus(`Restaurado: ${key}`);
    };
    actions.appendChild(btnReset);
    head.appendChild(actions);

    const prev = document.createElement('div');
    prev.className = 'preview';
    prev.innerHTML = renderRichPreview(String(data[key] ?? ''));

    const ta = document.createElement('textarea');
    ta.value = String(data[key] ?? '');
    ta.addEventListener('focus', () => { activeTextarea = { ta, key, prev }; });
    ta.addEventListener('input', () => {
      data[key] = ta.value;
      prev.innerHTML = renderRichPreview(ta.value);
    });

    card.append(head, prev, ta);
    elList.appendChild(card);
  }
}

function wrapSelection(openTag, closeTag) {
  if (!activeTextarea) { setStatus('Haz clic o selecciona texto en un campo primero'); return; }
  const { ta, key, prev } = activeTextarea;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const val = ta.value;
  const selected = val.slice(start, end) || 'Texto';
  ta.value = val.slice(0, start) + openTag + selected + closeTag + val.slice(end);
  data[key] = ta.value;
  prev.innerHTML = renderRichPreview(ta.value);
  ta.focus();
}

document.getElementById('btnApplyColor').onclick = () => {
  const c = document.getElementById('singleColor').value.toUpperCase();
  wrapSelection(`<color=${c}>`, '</color>');
};
document.getElementById('btnApplyPrism').onclick = () => {
  const c1 = document.getElementById('p1').value.toUpperCase();
  const c2 = document.getElementById('p2').value.toUpperCase();
  const c3 = document.getElementById('useP3').checked ? ',' + document.getElementById('p3').value.toUpperCase() : '';
  const spd = parseFloat(document.getElementById('pSpeed').value || '1.0');
  const spdAttr = spd !== 1.0 ? ` speed=${spd}` : '';
  wrapSelection(`<prism=${c1},${c2}${c3}${spdAttr}>`, '</prism>');
};
document.getElementById('btnBold').onclick = () => wrapSelection('<bold>', '</bold>');
document.getElementById('btnItalic').onclick = () => wrapSelection('<italic>', '</italic>');
elSearch.oninput = renderList;

function loadJsonText(text, name) {
  try {
    const parsed = JSON.parse(text);
    originalData = { ...parsed };
    data = { ...parsed };
    elFileInfo.textContent = `Archivo: ${name} (${Object.keys(data).length} claves)`;
    renderList();
    setStatus('Archivo cargado');
  } catch (e) {
    alert('JSON inválido: ' + e.message);
  }
}

document.getElementById('btnOpen').onclick = async () => {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
      fileHandle = h;
      const f = await h.getFile();
      loadJsonText(await f.text(), f.name);
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  document.getElementById('fileInput').click();
};

document.getElementById('fileInput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  fileHandle = null;
  loadJsonText(await f.text(), f.name);
};

document.getElementById('btnSaveDirect').onclick = async () => {
  if (!fileHandle) { setStatus('Usa "Abrir texts.json" en Chrome/Edge para guardar directo, o usa Descargar'); return; }
  try {
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2) + '\n');
    await writable.close();
    originalData = { ...data };
    setStatus('Guardado directamente en disco');
  } catch (e) { alert('No se pudo guardar: ' + e.message); }
};

document.getElementById('btnDownload').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'texts.json';
  a.click();
};

document.getElementById('btnCopy').onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(data, null, 2) + '\n');
  setStatus('JSON copiado al portapapeles');
};

const dz = document.getElementById('dropZone');
dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('dragover'); };
dz.ondragleave = () => dz.classList.remove('dragover');
dz.ondrop = async (e) => {
  e.preventDefault();
  dz.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) { fileHandle = null; loadJsonText(await f.text(), f.name); }
};
